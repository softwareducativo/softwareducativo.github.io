<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <title>Jogo das Formas e Operações</title> <style> body { font-family: Arial, sans-serif; text-align: center; background: #f0f8ff; margin: 0; padding: 20px; } h1 { color: #333; } .formas { display: flex; justify-content: center; gap: 20px; margin: 20px; } .forma { width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; transition: transform 0.3s; } .forma:hover { transform: scale(1.1); } .circulo { border-radius: 50%; background: #ffcccb; } .quadrado { background: #add8e6; } .retangulo { width: 150px; height: 100px; background: #90ee90; } .triangulo { width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 100px solid #f4a460; position: relative; } .triangulo span { position: absolute; top: 30px; left: -10px; color: white; font-weight: bold; } .operacoes { margin: 20px; } .operacoes button { margin: 5px; padding: 10px 20px; font-size: 18px; cursor: pointer; } .feedback { font-size: 24px; font-weight: bold; margin: 20px; } .acerto { color: green; } .erro { color: red; } </style> </head> <body> <h1>Jogo das Formas e Operações</h1> <p id="pergunta"></p> <div class="formas"> <div class="forma circulo" data-forma="circulo"></div> <div class="forma quadrado" data-forma="quadrado"></div> <div class="forma retangulo" data-forma="retangulo"></div> <div class="forma triangulo" data-forma="triangulo"> <span></span> </div> </div> <div class="operacoes"> <button onclick="selecionarOperacao('+')">+</button> <button onclick="selecionarOperacao('-')">-</button> <button onclick="selecionarOperacao('*')">×</button> </div> <div class="feedback" id="feedback"></div> <script> const formas = { circulo: {valor: 0}, quadrado: {valor: 0}, retangulo: {valor: 0}, triangulo: {valor: 0} }; let operacaoSelecionada = '+'; let selecionadas = []; let respostaCorreta = 0; const perguntaEl = document.getElementById('pergunta'); const feedbackEl = document.getElementById('feedback'); function gerarValores() { for (let key in formas) { formas[key].valor = Math.floor(Math.random() * 9) + 1; } document.querySelector('.circulo').textContent = formas.circulo.valor; document.querySelector('.quadrado').textContent = formas.quadrado.valor; document.querySelector('.retangulo').textContent = formas.retangulo.valor; document.querySelector('.triangulo span').textContent = formas.triangulo.valor; } function novaPergunta() { gerarValores(); const formaKeys = Object.keys(formas); const f1 = formaKeys[Math.floor(Math.random() * formaKeys.length)]; const f2 = formaKeys[Math.floor(Math.random() * formaKeys.length)]; const ops = ['+', '-', '*']; const op = ops[Math.floor(Math.random() * ops.length)]; const val1 = formas[f1].valor; const val2 = formas[f2].valor; switch (op) { case '+': respostaCorreta = val1 + val2; break; case '-': respostaCorreta = val1 - val2; break; case '*': respostaCorreta = val1 * val2; break; } perguntaEl.textContent = `Qual combinação de formas, usando ${op}, resulta em ${respostaCorreta}?`; selecionadas = []; } function selecionarOperacao(op) { operacaoSelecionada = op; } function mostrarFeedback(mensagem, tipo) { feedbackEl.textContent = mensagem; feedbackEl.className = `feedback ${tipo}`; setTimeout(() => { feedbackEl.textContent = ''; }, 2000); } document.querySelectorAll('.forma').forEach(el => { el.addEventListener('click', () => { const nomeForma = el.dataset.forma; selecionadas.push(nomeForma); if (selecionadas.length === 2) { const val1 = formas[selecionadas[0]].valor; const val2 = formas[selecionadas[1]].valor; let resultado; switch (operacaoSelecionada) { case '+': resultado = val1 + val2; break; case '-': resultado = val1 - val2; break; case '*': resultado = val1 * val2; break; } if (resultado === respostaCorreta) { mostrarFeedback('Acertou! 🎉', 'acerto'); setTimeout(novaPergunta, 2000); } else { mostrarFeedback('Errou! ❌ Tente de novo.', 'erro'); } selecionadas = []; } }); }); novaPergunta(); </script> </body> </html>
